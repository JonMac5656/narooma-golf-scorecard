<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Narooma Golf Scorecard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>⛳ Narooma Golf Club · Par 72</h1>
    <nav id="nav" aria-label="Main navigation"></nav>
  </header>

  <main id="app"></main>

  <div id="modal" class="modal" aria-live="polite" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h3 id="modal-title">Confirm</h3>
      <p id="modal-message"></p>
      <input type="text" id="modal-input" class="modal-input" style="display:none" placeholder="Enter name">
      <div class="modal-actions">
        <button class="cancel" id="modal-cancel" type="button">Cancel</button>
        <button class="confirm" id="modal-confirm" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
