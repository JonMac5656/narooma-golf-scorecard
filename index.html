<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Narooma Golf Scorecard</title>
<style>
:root{--bg:#f7f8f5;--fg:#1c2b22;--mut:#6b7a70;--line:#d5dcd3;--hd:#1f5c3a;--hdfg:#fff;--sub:#e7eee6;--in:#fff;--bad:#b3402f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--fg:#e6eee8;--mut:#93a39a;--line:#2b3a31;--hd:#2e7d52;--sub:#1c2922;--in:#18231c;--bad:#e0705f}}
:root[data-theme="dark"]{--bg:#121a15;--fg:#e6eee8;--mut:#93a39a;--line:#2b3a31;--hd:#2e7d52;--sub:#1c2922;--in:#18231c;--bad:#e0705f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--hd);color:#fff;padding:12px 16px 0}
h1{font-size:18px;margin:0 0 8px}
nav{display:flex;gap:4px}
nav button{flex:1;background:transparent;color:#fffc;border:0;border-bottom:3px solid transparent;padding:8px;font:inherit;cursor:pointer}
nav button.on{color:#fff;border-bottom-color:#fff;font-weight:600}
main{max-width:640px;margin:0 auto;padding:14px 16px 40px}
button{font:inherit;color:var(--fg)}
.row{display:flex;gap:6px;margin-bottom:12px;align-items:center}
.chip{flex:1;padding:8px 4px;border:1px solid var(--line);background:var(--in);border-radius:8px;cursor:pointer}
.chip.on{background:var(--hd);color:#fff;border-color:var(--hd)}
.hole{display:flex;align-items:center;justify-content:space-between;background:var(--sub);border-radius:12px;padding:10px;margin-bottom:12px}
.hole .c{text-align:center}
.hole b{font-size:26px;display:block;line-height:1.1}
.hole span{color:var(--mut);font-size:13px}
.hole button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--in);font-size:20px;cursor:pointer}
.pl{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:10px 0}
.pl input.nm{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;font-weight:600}
.pl .tt{font-size:12px;color:var(--mut);width:70px;text-align:right}
.pl .sc{width:40px;text-align:center;font-size:24px;font-weight:700}
.pl button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--in);font-size:22px;cursor:pointer}
.act{display:block;width:100%;margin-top:14px;padding:12px;border-radius:10px;border:0;background:var(--hd);color:#fff;cursor:pointer;font-weight:600}
.act.g{background:var(--in);color:var(--fg);border:1px solid var(--line)}
.w{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:5px 3px;text-align:center}
th{background:var(--hd);color:#fff;font-size:13px}
tr.t td{background:var(--sub);font-weight:600}
td input{width:42px;padding:5px 2px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--in);color:var(--fg);font:inherit}
.m{color:var(--mut)}
.rd{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--in)}
.rd .h{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:4px}
.rd .h button{background:none;border:0;color:var(--bad);cursor:pointer}
.n{font-size:12px;color:var(--mut);margin-top:14px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.k{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--in)}
.k b{font-size:22px;display:block}.k span{font-size:12px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar span.l{width:105px;font-size:13px}.bar i{display:block;height:14px;background:var(--hd);border-radius:4px;min-width:2px}.bar em{font-style:normal;font-size:12px;color:var(--mut)}
.tr{display:flex;align-items:flex-end;gap:4px;height:100px}.tr div{flex:1;background:var(--hd);border-radius:4px 4px 0 0;color:#fff;font-size:11px;text-align:center;padding-top:2px}
h2{font-size:15px;margin:18px 0 6px}
.hl{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
</style>
</head>
<body>
<header><h1>⛳ Narooma Golf Club · Par 72</h1><nav id="nav"></nav></header>
<main id="app"></main>
<script>
var par=[4,4,3,4,5,4,4,4,3,4,5,4,4,3,4,5,3,5];
var D={Black:[398,330,141,368,458,311,424,317,193,320,460,333,369,169,344,427,129,450],
White:[393,330,132,360,448,301,416,308,184,310,448,323,360,162,325,424,121,445],
Red:[358,247,109,313,436,291,389,226,144,250,402,280,319,160,296,401,120,411]};
var SIb=[1,10,11,7,18,15,4,16,3,8,12,9,2,6,5,14,17,13];
var SI={Black:SIb,White:SIb,Red:[18,8,12,3,14,6,10,1,16,5,11,2,15,7,13,4,17,9]};
var S={tee:"White",n:2,names:["","","",""],sc:[[],[],[],[]],hole:0,view:"play"};
var R=[];
try{var a=JSON.parse(localStorage.getItem("ng_state"));if(a)S=a;var b=JSON.parse(localStorage.getItem("ng_rounds"));if(b)R=b}catch(e){}
function save(){try{localStorage.setItem("ng_state",JSON.stringify(S));localStorage.setItem("ng_rounds",JSON.stringify(R))}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function nm(p){return S.names[p]||"Player "+(p+1)}
function sum(a,f,t){var s=0;for(var i=f;i<t;i++)s+=a[i]||0;return s}
function T(arr,f,t){var s=0,pp=0;for(var i=f;i<t;i++){var v=parseInt(arr[i]);if(v>0){s+=v;pp+=par[i]}}return[s,pp]}
function fmt(r){if(!r[0])return"–";var d=r[0]-r[1];return r[0]+" ("+(d>0?"+"+d:d===0?"E":d)+")"}
function nav(){var h="";[["play","Play"],["card","Card"],["rounds","Rounds ("+R.length+")"],["stats","Stats"]].forEach(function(v){h+='<button data-a="view" data-v="'+v[0]+'" class="'+(S.view==v[0]?"on":"")+'">'+v[1]+"</button>"});document.getElementById("nav").innerHTML=h}
function setup(){var h='<div class="row">';["Black","White","Red"].forEach(function(k){h+='<button class="chip '+(S.tee==k?"on":"")+'" data-a="tee" data-v="'+k+'">'+k+(k=="Red"?" (L)":"")+"<br><small>"+sum(D[k],0,18)+" m</small></button>"});h+="</div>";
h+='<div class="row"><span class="m">Players</span>';for(var i=1;i<=4;i++)h+='<button class="chip '+(S.n==i?"on":"")+'" data-a="n" data-v="'+i+'">'+i+"</button>";return h+"</div>"}
function play(){var i=S.hole,h=setup();
h+='<div class="hole"><button data-a="prev">‹</button><div class="c"><b>Hole '+(i+1)+'</b><span>Par '+par[i]+" · "+D[S.tee][i]+" m · SI "+SI[S.tee][i]+'</span></div><button data-a="next">›</button></div>';
for(var p=0;p<S.n;p++){var v=S.sc[p][i];
h+='<div class="pl"><input class="nm" data-n="'+p+'" placeholder="Player '+(p+1)+'" value="'+esc(S.names[p])+'"><span class="tt">'+fmt(T(S.sc[p],0,18))+'</span><button data-a="dec" data-p="'+p+'">−</button><span class="sc">'+(v||"·")+'</span><button data-a="inc" data-p="'+p+'">+</button></div>'}
h+='<button class="act" data-a="finish">Finish &amp; save round</button><button class="act g" data-a="clear">Clear scores</button>';return h}
function card(){var h=setup()+'<div class="w"><table><tr><th>Hole</th><th>Par</th><th>SI</th><th>'+S.tee+"</th>";
for(var p=0;p<S.n;p++)h+="<th>"+esc(nm(p))+"</th>";h+="</tr>";
function sub(l,f,t){var r='<tr class="t"><td>'+l+"</td><td>"+sum(par,f,t)+"</td><td></td><td>"+sum(D[S.tee],f,t)+"</td>";for(var p=0;p<S.n;p++)r+="<td>"+fmt(T(S.sc[p],f,t))+"</td>";return r+"</tr>"}
for(var i=0;i<18;i++){h+="<tr><td>"+(i+1)+"</td><td>"+par[i]+'</td><td class="m">'+SI[S.tee][i]+"</td><td>"+D[S.tee][i]+"</td>";
for(var p=0;p<S.n;p++)h+='<td><input type="number" inputmode="numeric" min="1" max="20" data-p="'+p+'" data-h="'+i+'" value="'+(S.sc[p][i]||"")+'"></td>';h+="</tr>";
if(i==8)h+=sub("Out",0,9);if(i==17){h+=sub("In",9,18)+sub("Total",0,18)}}
return h+'</table></div><button class="act" data-a="finish">Finish &amp; save round</button>'}
function rounds(){if(!R.length)return'<p class="m">No saved rounds yet. Finish a round to save it here.</p>';var h="";
for(var k=R.length-1;k>=0;k--){var r=R[k];h+='<div class="rd"><div class="h"><span>'+esc(r.d)+" · "+r.tee+'</span><button data-a="del" data-v="'+k+'">Delete</button></div>';
for(var p=0;p<r.names.length;p++)h+='<div style="display:flex;justify-content:space-between"><b>'+esc(r.names[p])+"</b><span>Out "+T(r.sc[p],0,9)[0]+" · In "+T(r.sc[p],9,18)[0]+" · <b>"+fmt(T(r.sc[p],0,18))+"</b></span></div>";h+="</div>"}return h}
function allNames(){var n=[];R.forEach(function(r){r.names.forEach(function(x){if(n.indexOf(x)<0)n.push(x)})});return n}
function sg(d){return(d>=0?"+":"")+d.toFixed(2)}
function stats(){
if(!R.length)return'<p class="m">Save a round to see stats.</p>';
var names=allNames();if(names.indexOf(S.sp)<0)S.sp=names[0];
var h='<div class="row" style="flex-wrap:wrap">';
names.forEach(function(n,i){h+='<button class="chip '+(n==S.sp?"on":"")+'" data-a="sp" data-v="'+i+'">'+esc(n)+"</button>"});h+="</div>";
var rs=[],g=[],dist=[0,0,0,0,0],pt={3:[0,0],4:[0,0],5:[0,0]},hd=[],bf=0,bb=0,i;
for(i=0;i<18;i++)hd.push([0,0]);
R.forEach(function(r){var k=r.names.indexOf(S.sp);if(k>=0)rs.push(r.sc[k])});
rs.forEach(function(sc){
var t=T(sc,0,18),f=T(sc,0,9),b=T(sc,9,18);
if(t[1]==72)g.push(t[0]);
if(f[1]==35&&(!bf||f[0]<bf))bf=f[0];
if(b[1]==37&&(!bb||b[0]<bb))bb=b[0];
for(var j=0;j<18;j++){var v=parseInt(sc[j]);if(!(v>0))continue;var d=v-par[j];
dist[d<=-2?0:d==-1?1:d==0?2:d==1?3:4]++;pt[par[j]][0]+=d;pt[par[j]][1]++;hd[j][0]+=d;hd[j][1]++}});
var mn=g.length?Math.min.apply(null,g):0,mx=g.length?Math.max.apply(null,g):0,av=g.length?g.reduce(function(a,b){return a+b},0)/g.length:0;
function tile(l,v){return'<div class="k"><b>'+v+"</b><span>"+l+"</span></div>"}
h+='<div class="g">'+tile("Rounds",rs.length)+tile("Best 18",mn||"–")+tile("Average 18",g.length?av.toFixed(1):"–")+tile("Worst 18",mx||"–")+tile("Best front 9",bf||"–")+tile("Best back 9",bb||"–")+"</div>";
if(g.length)h+='<div class="m" style="font-size:13px">Average vs par: '+sg(av-72)+" (full 18-hole rounds only: "+g.length+")</div>";
var tot=dist.reduce(function(a,b){return a+b},0);
h+="<h2>Scoring</h2>";
["Eagle or better","Birdie","Par","Bogey","Double or worse"].forEach(function(l,k){var pc=tot?dist[k]/tot*100:0;h+='<div class="bar"><span class="l">'+l+'</span><i style="width:'+pc*0.6+'%"></i><em>'+dist[k]+" · "+Math.round(pc)+"%</em></div>"});
h+="<h2>Average vs par by hole type</h2>";
[3,4,5].forEach(function(q){h+='<div class="hl"><span>Par '+q+'s</span><b>'+(pt[q][1]?sg(pt[q][0]/pt[q][1]):"–")+"</b></div>"});
var hs=[];hd.forEach(function(x,k){if(x[1])hs.push({k:k,a:x[0]/x[1]})});hs.sort(function(a,b){return b.a-a.a});
function hl(a){return a.map(function(o){return'<div class="hl"><span>Hole '+(o.k+1)+' (par '+par[o.k]+')</span><b>'+sg(o.a)+"</b></div>"}).join("")}
if(hs.length>=6){h+="<h2>Hardest holes</h2>"+hl(hs.slice(0,3))+"<h2>Best holes</h2>"+hl(hs.slice(-3).reverse())}
if(g.length>1){var last=g.slice(-10),lo=Math.min.apply(null,last)-5,hi=Math.max.apply(null,last)+3;
h+="<h2>Last "+last.length+" rounds (gross)</h2><div class=\"tr\">"+last.map(function(v){return'<div style="height:'+((v-lo)/(hi-lo)*100)+'%">'+v+"</div>"}).join("")+"</div>"}
return h}
function render(){nav();var a=document.getElementById("app");a.innerHTML=S.view=="play"?play():S.view=="card"?card():S.view=="stats"?stats():rounds();
if(S.view=="play"||S.view=="card")a.insertAdjacentHTML("beforeend",'<div class="n">Pars, distances and stroke index from Golfify; other sites list longer yardages, so check the club\'s printed card if it matters.</div>')}
document.addEventListener("click",function(e){var x=e.target.closest("[data-a]");if(!x)return;var a=x.getAttribute("data-a"),v=x.getAttribute("data-v"),p=x.getAttribute("data-p"),i=S.hole;
if(a=="view")S.view=v;else if(a=="tee")S.tee=v;else if(a=="n")S.n=+v;
else if(a=="prev")S.hole=(i+17)%18;else if(a=="next")S.hole=(i+1)%18;
else if(a=="inc"){var c=S.sc[p][i];S.sc[p][i]=c?Math.min(20,c+1):par[i]}
else if(a=="dec"){var c2=S.sc[p][i];S.sc[p][i]=c2?Math.max(1,c2-1):par[i]}
else if(a=="clear"){S.sc=[[],[],[],[]];S.hole=0}
else if(a=="finish"){var any=false;for(var q=0;q<S.n;q++)if(T(S.sc[q],0,18)[0])any=true;if(!any)return;
R.push({d:new Date().toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"}),tee:S.tee,names:S.names.slice(0,S.n).map(function(_,k){return nm(k)}),sc:S.sc.slice(0,S.n).map(function(s){return s.slice()})});
S.sc=[[],[],[],[]];S.hole=0;S.view="rounds"}
else if(a=="sp")S.sp=allNames()[+v];
else if(a=="del")R.splice(+v,1);
save();render()});
document.addEventListener("change",function(e){var x=e.target;
if(x.hasAttribute("data-n")){S.names[x.getAttribute("data-n")]=x.value;save();return}
if(x.hasAttribute("data-h")){S.sc[x.getAttribute("data-p")][x.getAttribute("data-h")]=parseInt(x.value)||undefined;save();render()}});
render();
</script>
</body>
</html>
