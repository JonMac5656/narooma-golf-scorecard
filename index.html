<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Narooma Golf Scorecard</title>
  <style>
    :root {
      --bg: #f7f8f5;
      --fg: #1c2b22;
      --mut: #6b7a70;
      --line: #d5dcd3;
      --hd: #1f5c3a;
      --hdfg: #fff;
      --sub: #e7eee6;
      --in: #fff;
      --bad: #b3402f;
      --shadow: rgba(0, 0, 0, 0.2);
      --panel: #f3f6f2;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121a15;
        --fg: #e6eee8;
        --mut: #93a39a;
        --line: #2b3a31;
        --hd: #2e7d52;
        --sub: #1c2922;
        --in: #18231c;
        --bad: #e0705f;
        --panel: #18241d;
      }
    }

    :root[data-theme="dark"] {
      --bg: #121a15;
      --fg: #e6eee8;
      --mut: #93a39a;
      --line: #2b3a31;
      --hd: #2e7d52;
      --sub: #1c2922;
      --in: #18231c;
      --bad: #e0705f;
      --panel: #18241d;
    }

    * { box-sizing: border-box; }

    html {
      scroll-padding-top: var(--safe-top);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
      color: var(--fg);
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--hd);
      outline-offset: 2px;
    }

    header {
      background: var(--hd);
      color: #fff;
      padding: max(12px, var(--safe-top)) 16px 0;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 8px;
    }

    nav {
      display: flex;
      gap: 4px;
    }

    nav button {
      flex: 1;
      background: transparent;
      color: rgba(255, 255, 255, 0.9);
      border: 0;
      border-bottom: 3px solid transparent;
      padding: 8px;
      font: inherit;
      cursor: pointer;
    }

    nav button.on {
      color: #fff;
      border-bottom-color: #fff;
      font-weight: 600;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 14px 16px 40px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .chip {
      flex: 1;
      min-width: 60px;
      padding: 8px 4px;
      border: 1px solid var(--line);
      background: var(--in);
      border-radius: 8px;
      cursor: pointer;
    }

    .chip.on {
      background: var(--hd);
      color: #fff;
      border-color: var(--hd);
    }

    .hole {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--sub);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .hole .c {
      text-align: center;
      flex: 1;
    }

    .hole b {
      display: block;
      font-size: 26px;
      line-height: 1.1;
    }

    .hole span {
      color: var(--mut);
      font-size: 13px;
    }

    .hole button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--in);
      font-size: 20px;
    }

    .pl {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
    }

    .pl b {
      width: 40px;
      text-align: left;
      min-width: 40px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pl .tt {
      font-size: 12px;
      color: var(--mut);
      width: 70px;
      text-align: right;
      flex-shrink: 0;
    }

    .pl .sc {
      width: 40px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .pl button {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--in);
      font-size: 22px;
    }

    .act {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      border: 0;
      background: var(--hd);
      color: #fff;
      font-weight: 600;
    }

    .act.g {
      background: var(--in);
      color: var(--fg);
      border: 1px solid var(--line);
    }

    .act.danger {
      background: #d9534f;
      color: #fff;
    }

    .w {
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 420px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 5px 3px;
      text-align: center;
    }

    th {
      background: var(--hd);
      color: #fff;
      font-size: 13px;
    }

    tr.t td {
      background: var(--sub);
      font-weight: 600;
    }

    td input {
      width: 42px;
      padding: 5px 2px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--in);
      color: var(--fg);
    }

    .m {
      color: var(--mut);
    }

    .rd {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: var(--in);
    }

    .rd .h {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--mut);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .rd .h button {
      background: none;
      border: 0;
      color: var(--bad);
      font-size: 18px;
      padding: 0;
    }

    .n {
      font-size: 12px;
      color: var(--mut);
      margin-top: 14px;
    }

    .g {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 6px;
    }

    .k {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: var(--in);
    }

    .k b {
      display: block;
      font-size: 22px;
    }

    .k span {
      font-size: 12px;
      color: var(--mut);
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
    }

    .bar span.l {
      width: 105px;
      font-size: 13px;
    }

    .bar i {
      display: block;
      height: 14px;
      background: var(--hd);
      border-radius: 4px;
      min-width: 2px;
    }

    .bar em {
      font-style: normal;
      font-size: 12px;
      color: var(--mut);
      width: 20px;
      text-align: right;
    }

    .tr {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 100px;
    }

    .tr div {
      flex: 1;
      background: var(--hd);
      border-radius: 4px 4px 0 0;
      color: #fff;
      font-size: 11px;
      text-align: center;
      padding-top: 2px;
      min-width: 0;
    }

    h2 {
      font-size: 15px;
      margin: 18px 0 6px;
    }

    .hl {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding: 4px 0;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--bg);
      border-radius: 12px;
      padding: 24px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 10px 30px var(--shadow);
    }

    .modal-content h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .modal-content p {
      margin: 0 0 18px;
      color: var(--mut);
      line-height: 1.5;
      white-space: pre-line;
    }

    .modal-input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--in);
      color: var(--fg);
      box-sizing: border-box;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
    }

    .modal-actions .cancel {
      background: var(--line);
      color: var(--fg);
    }

    .modal-actions .confirm {
      background: var(--bad);
      color: #fff;
    }

    .players-section {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      background: var(--sub);
      margin: 12px 0;
    }

    .players-section h3 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .players-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-item input {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--in);
      color: var(--fg);
    }

    .player-item button {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--in);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>⛳ Narooma Golf Club · Par 72</h1>
    <nav id="nav" aria-label="Main navigation"></nav>
  </header>

  <main id="app"></main>

  <div id="modal" class="modal" aria-live="polite">
    <div class="modal-content">
      <h3 id="modal-title">Confirm</h3>
      <p id="modal-message"></p>
      <input type="text" id="modal-input" class="modal-input" style="display:none" placeholder="Enter name">
      <div class="modal-actions">
        <button class="cancel" id="modal-cancel" type="button">Cancel</button>
        <button class="confirm" id="modal-confirm" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const PAR = [4, 4, 3, 4, 5, 4, 4, 4, 3, 4, 5, 4, 4, 3, 4, 5, 3, 5];
    const DISTANCES = {
      Black: [398, 330, 141, 368, 458, 311, 424, 317, 193, 320, 460, 333, 369, 169, 344, 427, 129, 450],
      White: [393, 330, 132, 360, 448, 301, 416, 308, 184, 310, 448, 323, 360, 162, 325, 424, 121, 445],
      Red: [358, 247, 109, 313, 436, 291, 389, 226, 144, 250, 402, 280, 319, 160, 296, 401, 120, 411]
    };
    const STROKE_INDEX_BASE = [1, 10, 11, 7, 18, 15, 4, 16, 3, 8, 12, 9, 2, 6, 5, 14, 17, 13];
    const STROKE_INDEX = {
      Black: STROKE_INDEX_BASE,
      White: STROKE_INDEX_BASE,
      Red: [18, 8, 12, 3, 14, 6, 10, 1, 16, 5, 11, 2, 15, 7, 13, 4, 17, 9]
    };

    const DEFAULT_STATE = {
      tee: 'White',
      n: 2,
      names: ['', '', '', ''],
      sc: [[], [], [], []],
      hole: 0,
      view: 'play',
      sp: ''
    };

    const STORAGE_KEYS = {
      state: 'ng_state',
      rounds: 'ng_rounds'
    };

    const ui = {
      app: document.getElementById('app'),
      nav: document.getElementById('nav'),
      modal: document.getElementById('modal'),
      modalTitle: document.getElementById('modal-title'),
      modalMessage: document.getElementById('modal-message'),
      modalInput: document.getElementById('modal-input'),
      modalConfirm: document.getElementById('modal-confirm'),
      modalCancel: document.getElementById('modal-cancel')
    };

    let state = createFreshState();
    let rounds = [];
    let modalCallback = null;
    let modalInputMode = false;

    function createFreshState() {
      return {
        ...DEFAULT_STATE,
        names: [...DEFAULT_STATE.names],
        sc: DEFAULT_STATE.sc.map((row) => [...row])
      };
    }

    function clampScore(value) {
      const score = Number.parseInt(value, 10);
      if (!Number.isFinite(score)) return undefined;
      return Math.min(20, Math.max(1, score));
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function sum(values, start, end) {
      let total = 0;
      for (let i = start; i < end; i++) total += Number(values[i]) || 0;
      return total;
    }

    function getPlayerName(index) {
      return state.names[index] || `Player ${index + 1}`;
    }

    function getTotalForRange(scores, start, end) {
      let scoreTotal = 0;
      let parTotal = 0;
      for (let i = start; i < end; i++) {
        const value = Number.parseInt(scores[i], 10);
        if (value > 0) {
          scoreTotal += value;
          parTotal += PAR[i];
        }
      }
      return [scoreTotal, parTotal];
    }

    function formatScoreLine(scores) {
      const total = getTotalForRange(scores, 0, 18);
      if (!total[0]) return '–';
      const diff = total[0] - total[1];
      return `${total[0]} (${diff > 0 ? '+' + diff : diff === 0 ? 'E' : diff})`;
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEYS.state, JSON.stringify(state));
        localStorage.setItem(STORAGE_KEYS.rounds, JSON.stringify(rounds));
      } catch (error) {
        // Ignore storage errors so the app still works in private browsing or restricted contexts.
      }
    }

    function normalizeSavedState(savedState) {
      if (!savedState || typeof savedState !== 'object') return createFreshState();

      const names = Array.isArray(savedState.names)
        ? savedState.names.slice(0, 4).concat(Array(4).fill('')).slice(0, 4)
        : [...DEFAULT_STATE.names];

      const sc = Array.from({ length: 4 }, (_, index) => {
        if (Array.isArray(savedState.sc) && Array.isArray(savedState.sc[index])) {
          return savedState.sc[index].slice();
        }
        return [];
      });

      return {
        ...DEFAULT_STATE,
        ...savedState,
        names,
        sc,
        n: Math.min(4, Math.max(1, Number(savedState.n) || DEFAULT_STATE.n)),
        hole: Math.min(17, Math.max(0, Number(savedState.hole) || 0)),
        view: ['play', 'card', 'rounds', 'stats'].includes(savedState.view) ? savedState.view : 'play'
      };
    }

    function loadSavedData() {
      try {
        const savedState = JSON.parse(localStorage.getItem(STORAGE_KEYS.state) || 'null');
        const savedRounds = JSON.parse(localStorage.getItem(STORAGE_KEYS.rounds) || 'null');

        state = normalizeSavedState(savedState);
        rounds = Array.isArray(savedRounds) ? savedRounds : [];
      } catch (error) {
        state = createFreshState();
        rounds = [];
      }
    }

    function showModal(title, message, callback, inputMode = false) {
      ui.modalTitle.textContent = title;
      ui.modalMessage.textContent = message;
      modalCallback = callback || null;
      modalInputMode = inputMode;

      if (inputMode) {
        ui.modalInput.style.display = 'block';
        ui.modalInput.value = '';
        ui.modalInput.focus();
      } else {
        ui.modalInput.style.display = 'none';
        ui.modalInput.value = '';
      }

      ui.modal.classList.add('show');
    }

    function closeModal() {
      ui.modal.classList.remove('show');
      ui.modalInput.value = '';
      modalCallback = null;
      modalInputMode = false;
    }

    function buildCsvData() {
      const rows = [['Date', 'Tee', 'Player', 'Front 9', 'Back 9', 'Total', 'Vs Par']];

      rounds.forEach((round) => {
        round.names.forEach((playerName, playerIndex) => {
          const scores = round.sc[playerIndex] || [];
          const front = getTotalForRange(scores, 0, 9);
          const back = getTotalForRange(scores, 9, 18);
          const total = getTotalForRange(scores, 0, 18);

          rows.push([
            round.d,
            round.tee,
            playerName,
            front[0] || '',
            back[0] || '',
            total[0] || '',
            total[0] ? total[0] - total[1] : ''
          ]);
        });
      });

      return rows.map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
    }

    function exportToGoogleSheets() {
      const csv = buildCsvData();

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(csv).catch(() => {});
      }

      window.open('https://docs.google.com/spreadsheets/u/0/', '_blank');

      showModal(
        'Google Sheets export ready',
        'The round data has been copied to your clipboard. Open Google Sheets and paste the CSV into a new sheet.\n\nCSV preview:\n' + csv.split('\n').slice(0, 8).join('\n'),
        () => closeModal()
      );
    }

    function clearAllStats() {
      showModal(
        'Clear all saved stats?',
        'This will permanently remove all saved rounds and scores from this app.',
        () => {
          rounds = [];
          state.sp = '';
          save();
          render();
          closeModal();
        }
      );
    }

    function editPlayerName(index) {
      showModal(
        `Edit Player ${index + 1} Name`,
        'Enter the player name:',
        () => {
          const inputValue = ui.modalInput.value.trim();
          state.names[index] = inputValue;
          save();
          render();
          closeModal();
        },
        true
      );

      ui.modalInput.value = state.names[index] || '';
    }

    function setupTee() {
      const labels = ['Black', 'White', 'Red'];
      let html = '<div class="row"><span class="m">Tee</span>';
      labels.forEach((tee) => {
        html += '<button class="chip ' + (state.tee === tee ? 'on' : '') + '" data-a="tee" data-v="' + tee + '" aria-label="Select ' + tee + ' tee">' + tee + (tee === 'Red' ? ' (L)' : '') + '</button>';
      });
      html += '</div>';
      return html;
    }

    function setupPlayers() {
      let html = '<div class="row"><span class="m">Players</span>';
      for (let i = 1; i <= 4; i++) {
        html += '<button class="chip ' + (state.n === i ? 'on' : '') + '" data-a="n" data-v="' + i + '" aria-label="Set number of players to ' + i + '">' + i + '</button>';
      }
      html += '</div>';

      html += '<div class="players-section">';
      html += '<h3>Player names</h3>';
      html += '<div class="players-list">';
      for (let i = 0; i < state.n; i++) {
        html += '<div class="player-item">';
        html += '<input type="text" data-player="' + i + '" value="' + escapeHtml(state.names[i]) + '" placeholder="Player ' + (i + 1) + '" aria-label="Player ' + (i + 1) + ' name">';
        html += '<button data-a="edit-player" data-v="' + i + '" aria-label="Edit player ' + (i + 1) + ' name" title="Edit">✎</button>';
        html += '</div>';
      }
      html += '</div>';
      html += '</div>';

      return html;
    }

    function renderPlayView() {
      const holeIndex = state.hole;
      let html = setupTee();

      html += '<div class="hole">';
      html += '<button data-a="prev" aria-label="Previous hole">‹</button>';
      html += '<div class="c"><b>Hole ' + (holeIndex + 1) + '</b><span>Par ' + PAR[holeIndex] + ' · ' + DISTANCES[state.tee][holeIndex] + ' m · SI ' + STROKE_INDEX[state.tee][holeIndex] + '</span></div>';
      html += '<button data-a="next" aria-label="Next hole">›</button>';
      html += '</div>';

      for (let playerIndex = 0; playerIndex < state.n; playerIndex++) {
        const score = state.sc[playerIndex][holeIndex];
        html += '<div class="pl">';
        html += '<b>' + escapeHtml(getPlayerName(playerIndex)) + '</b>';
        html += '<span class="tt">' + formatScoreLine(state.sc[playerIndex]) + '</span>';
        html += '<button data-a="dec" data-p="' + playerIndex + '" aria-label="Decrease score for ' + getPlayerName(playerIndex) + '">−</button>';
        html += '<span class="sc">' + (score || 0) + '</span>';
        html += '<button data-a="inc" data-p="' + playerIndex + '" aria-label="Increase score for ' + getPlayerName(playerIndex) + '">+</button>';
        html += '</div>';
      }

      html += '<button class="act" data-a="finish">Finish &amp; save round</button>';
      html += '<button class="act g" data-a="clear">Clear scores</button>';
      html += setupPlayers();

      return html;
    }

    function renderCardView() {
      let html = setupTee();
      html += '<div class="w"><table><tr><th>Hole</th><th>Par</th><th>SI</th><th>' + state.tee + '</th>';

      for (let playerIndex = 0; playerIndex < state.n; playerIndex++) {
        html += '<th>' + escapeHtml(getPlayerName(playerIndex)) + '</th>';
      }
      html += '</tr>';

      function subtotalRow(label, start, end) {
        let row = '<tr class="t"><td>' + label + '</td><td>' + sum(PAR, start, end) + '</td><td></td><td>' + sum(DISTANCES[state.tee], start, end) + '</td>';
        for (let playerIndex = 0; playerIndex < state.n; playerIndex++) {
          row += '<td>' + formatScoreLine(state.sc[playerIndex].slice(start, end)) + '</td>';
        }
        return row + '</tr>';
      }

      for (let holeIndex = 0; holeIndex < 18; holeIndex++) {
        html += '<tr><td>' + (holeIndex + 1) + '</td><td>' + PAR[holeIndex] + '</td><td class="m">' + STROKE_INDEX[state.tee][holeIndex] + '</td><td>' + DISTANCES[state.tee][holeIndex] + '</td>';
        for (let playerIndex = 0; playerIndex < state.n; playerIndex++) {
          const value = state.sc[playerIndex][holeIndex] || '';
          html += '<td><input type="number" inputmode="numeric" min="1" max="20" data-p="' + playerIndex + '" data-h="' + holeIndex + '" value="' + value + '" aria-label="Score for ' + escapeHtml(getPlayerName(playerIndex)) + ' on hole ' + (holeIndex + 1) + '"></td>';
        }
        html += '</tr>';

        if (holeIndex === 8) html += subtotalRow('Out', 0, 9);
        if (holeIndex === 17) html += subtotalRow('In', 9, 18) + subtotalRow('Total', 0, 18);
      }

      html += '</table></div><button class="act" data-a="finish">Finish &amp; save round</button>';
      html += setupPlayers();
      return html;
    }

    function renderRoundsView() {
      if (!rounds.length) {
        return '<p class="m">No saved rounds yet. Finish a round to save it here.</p>' +
          '<div style="margin-top:20px"><button class="act g" data-a="export">Export saved rounds to Google Sheets</button></div>';
      }

      let html = '';
      for (let index = rounds.length - 1; index >= 0; index--) {
        const round = rounds[index];
        html += '<div class="rd"><div class="h"><span>' + escapeHtml(round.d) + ' · ' + round.tee + '</span><button data-a="del" data-v="' + index + '" aria-label="Delete round from ' + escapeHtml(round.d) + '">×</button></div>';
        for (let playerIndex = 0; playerIndex < round.names.length; playerIndex++) {
          const playerScores = round.sc[playerIndex] || [];
          const out = getTotalForRange(playerScores, 0, 9)[0];
          const inTotal = getTotalForRange(playerScores, 9, 18)[0];
          const total = getTotalForRange(playerScores, 0, 18)[0];
          html += '<div style="display:flex;justify-content:space-between"><b>' + escapeHtml(round.names[playerIndex]) + '</b><span>Out ' + out + ' · In ' + inTotal + ' · Total ' + total + '</span></div>';
        }
        html += '</div>';
      }

      html += '<div style="margin-top:20px;border-top:1px solid var(--line);padding-top:14px">';
      html += '<button class="act" data-a="export">Export to Google Sheets</button>';
      html += '<button class="act danger" data-a="clear-all">Clear all stats</button>';
      html += '</div>';
      return html;
    }

    function allNames() {
      const names = [];
      rounds.forEach((round) => {
        round.names.forEach((name) => {
          if (!name) return;
          if (names.indexOf(name) < 0) names.push(name);
        });
      });
      return names;
    }

    function formatDelta(value) {
      return (value >= 0 ? '+' : '') + value.toFixed(2);
    }

    function renderStatsView() {
      if (!rounds.length) return '<p class="m">Save a round to see stats.</p>';

      const names = allNames();
      if (names.indexOf(state.sp) < 0) state.sp = names[0] || '';

      let html = '<div class="row" style="flex-wrap:wrap">';
      names.forEach((name, index) => {
        html += '<button class="chip ' + (name === state.sp ? 'on' : '') + '" data-a="sp" data-v="' + index + '" aria-label="Show stats for ' + escapeHtml(name) + '">' + escapeHtml(name) + '</button>';
      });
      html += '</div>';

      const relevantScores = [];
      const grossScores = [];
      const distribution = [0, 0, 0, 0, 0];
      const byType = { 3: [0, 0], 4: [0, 0], 5: [0, 0] };
      const holeStats = [];

      let bestFront = 0;
      let bestBack = 0;
      let foundFront = false;
      let foundBack = false;

      for (let i = 0; i < 18; i++) holeStats.push([0, 0]);

      rounds.forEach((round) => {
        const playerIndex = round.names.indexOf(state.sp);
        if (playerIndex < 0) return;

        const scores = round.sc[playerIndex] || [];
        const total = getTotalForRange(scores, 0, 18);
        const front = getTotalForRange(scores, 0, 9);
        const back = getTotalForRange(scores, 9, 18);

        relevantScores.push(scores);
        if (total[1] === 72) grossScores.push(total[0]);

        if (front[1] === 35 && (!foundFront || front[0] < bestFront)) {
          bestFront = front[0];
          foundFront = true;
        }

        if (back[1] === 37 && (!foundBack || back[0] < bestBack)) {
          bestBack = back[0];
          foundBack = true;
        }

        for (let holeIndex = 0; holeIndex < 18; holeIndex++) {
          const value = Number.parseInt(scores[holeIndex], 10);
          if (!(value > 0)) continue;
          const delta = value - PAR[holeIndex];
          const bucket = delta <= -2 ? 0 : delta === -1 ? 1 : delta === 0 ? 2 : delta === 1 ? 3 : 4;
          distribution[bucket] += 1;
          byType[PAR[holeIndex]][0] += delta;
          byType[PAR[holeIndex]][1] += 1;
          holeStats[holeIndex][0] += delta;
          holeStats[holeIndex][1] += 1;
        }
      });

      const minGross = grossScores.length ? Math.min(...grossScores) : 0;
      const maxGross = grossScores.length ? Math.max(...grossScores) : 0;
      const avgGross = grossScores.length ? grossScores.reduce((sumOfValues, value) => sumOfValues + value, 0) / grossScores.length : 0;

      function statTile(label, value) {
        return '<div class="k"><b>' + value + '</b><span>' + label + '</span></div>';
      }

      html += '<div class="g">' +
        statTile('Rounds', relevantScores.length) +
        statTile('Best 18', minGross || '–') +
        statTile('Average 18', grossScores.length ? avgGross.toFixed(1) : '–') +
        statTile('Worst 18', maxGross || '–') +
        statTile('Best front 9', foundFront ? bestFront : '–') +
        statTile('Best back 9', foundBack ? bestBack : '–') +
        '</div>';

      if (grossScores.length) {
        html += '<div class="m" style="font-size:13px">Average vs par: ' + formatDelta(avgGross - 72) + ' (full 18-hole rounds only: ' + grossScores.length + ')</div>';
      }

      const totalScoredHoles = distribution.reduce((sumOfValues, value) => sumOfValues + value, 0);
      html += '<h2>Scoring</h2>';
      ['Eagle or better', 'Birdie', 'Par', 'Bogey', 'Double or worse'].forEach((label, index) => {
        const pct = totalScoredHoles ? distribution[index] / totalScoredHoles * 100 : 0;
        html += '<div class="bar"><span class="l">' + label + '</span><i style="width:' + (pct * 0.6) + '%"></i><em>' + distribution[index] + '</em></div>';
      });

      html += '<h2>Average vs par by hole type</h2>';
      [3, 4, 5].forEach((parValue) => {
        const values = byType[parValue];
        html += '<div class="hl"><span>Par ' + parValue + 's</span><b>' + (values[1] ? formatDelta(values[0] / values[1]) : '–') + '</b></div>';
      });

      const rankedHoles = [];
      holeStats.forEach((details, index) => {
        if (details[1]) rankedHoles.push({ holeIndex: index, average: details[0] / details[1] });
      });
      rankedHoles.sort((a, b) => b.average - a.average);

      function holeSummary(list) {
        return list.map((entry) => '<div class="hl"><span>Hole ' + (entry.holeIndex + 1) + ' (par ' + PAR[entry.holeIndex] + ')</span><b>' + formatDelta(entry.average) + '</b></div>').join('');
      }

      if (rankedHoles.length >= 6) {
        html += '<h2>Hardest holes</h2>' + holeSummary(rankedHoles.slice(0, 3));
        html += '<h2>Best holes</h2>' + holeSummary(rankedHoles.slice(-3).reverse());
      }

      if (grossScores.length > 1) {
        const lastRounds = grossScores.slice(-10);
        const minValue = Math.min(...lastRounds) - 5;
        const maxValue = Math.max(...lastRounds) + 3;
        html += '<h2>Last ' + lastRounds.length + ' rounds (gross)</h2><div class="tr">' + lastRounds.map((value) => '<div style="height:' + (((value - minValue) / (maxValue - minValue || 1)) * 100) + '%">' + value + '</div>').join('') + '</div>';
      }

      html += '<div style="margin-top:20px"><button class="act danger" data-a="clear-all">Clear stats</button></div>';
      return html;
    }

    function render() {
      ui.nav.innerHTML = [['play', 'Play'], ['card', 'Card'], ['rounds', 'Rounds (' + rounds.length + ')'], ['stats', 'Stats']].map(([viewKey, label]) => {
        return '<button data-a="view" data-v="' + viewKey + '" class="' + (state.view === viewKey ? 'on' : '') + '" aria-label="Open ' + label + '">' + label + '</button>';
      }).join('');

      const views = {
        play: renderPlayView(),
        card: renderCardView(),
        stats: renderStatsView(),
        rounds: renderRoundsView()
      };

      ui.app.innerHTML = views[state.view] || views.play;

      if (state.view === 'play' || state.view === 'card') {
        ui.app.insertAdjacentHTML('beforeend', '<div class="n">Pars, distances and stroke index from Golfify; other sites list longer yardages, so check the club\'s printed card if needed.</div>');
      }
    }

    function resetCurrentRound() {
      state.sc = Array.from({ length: 4 }, () => []);
      state.hole = 0;
    }

    function handleClick(event) {
      const target = event.target.closest('[data-a]');
      if (!target) return;

      const action = target.getAttribute('data-a');
      const value = target.getAttribute('data-v');
      const playerIndex = Number(target.getAttribute('data-p'));

      if (action === 'view') {
        state.view = value;
      } else if (action === 'tee') {
        state.tee = value;
      } else if (action === 'n') {
        state.n = Math.min(4, Math.max(1, Number(value)));
      } else if (action === 'prev') {
        state.hole = (state.hole + 17) % 18;
      } else if (action === 'next') {
        state.hole = (state.hole + 1) % 18;
      } else if (action === 'inc') {
        const current = Number(state.sc[playerIndex]?.[state.hole]);
        const nextValue = current > 0 ? Math.min(20, current + 1) : PAR[state.hole];
        state.sc[playerIndex] = state.sc[playerIndex] || [];
        state.sc[playerIndex][state.hole] = clampScore(nextValue) ?? PAR[state.hole];
      } else if (action === 'dec') {
        const current = Number(state.sc[playerIndex]?.[state.hole]);
        const nextValue = current > 0 ? Math.max(1, current - 1) : PAR[state.hole];
        state.sc[playerIndex] = state.sc[playerIndex] || [];
        state.sc[playerIndex][state.hole] = clampScore(nextValue) ?? PAR[state.hole];
      } else if (action === 'clear') {
        resetCurrentRound();
      } else if (action === 'finish') {
        let hasAnyScores = false;
        for (let index = 0; index < state.n; index++) {
          if (getTotalForRange(state.sc[index], 0, 18)[0]) hasAnyScores = true;
        }

        if (!hasAnyScores) return;

        const savedRound = {
          d: new Date().toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }),
          tee: state.tee,
          names: state.names.slice(0, state.n).map((_, index) => getPlayerName(index)),
          sc: state.sc.slice(0, state.n).map((scores) => (scores || []).slice())
        };

        rounds.push(savedRound);
        resetCurrentRound();
        state.view = 'rounds';
      } else if (action === 'sp') {
        state.sp = allNames()[Number(value)];
      } else if (action === 'del') {
        rounds.splice(Number(value), 1);
      } else if (action === 'export') {
        exportToGoogleSheets();
        save();
        return;
      } else if (action === 'clear-all') {
        clearAllStats();
        return;
      } else if (action === 'edit-player') {
        editPlayerName(Number(value));
        return;
      }

      save();
      render();
    }

    function handleChange(event) {
      const target = event.target;

      if (target.hasAttribute('data-player')) {
        const playerIndex = Number(target.getAttribute('data-player'));
        state.names[playerIndex] = target.value;
        save();
        return;
      }

      if (target.hasAttribute('data-h')) {
        const playerIndex = Number(target.getAttribute('data-p'));
        const holeIndex = Number(target.getAttribute('data-h'));
        state.sc[playerIndex] = state.sc[playerIndex] || [];
        const score = clampScore(target.value);
        state.sc[playerIndex][holeIndex] = score === undefined ? undefined : score;
        save();
        render();
      }
    }

    ui.modalConfirm.addEventListener('click', () => {
      if (modalCallback) modalCallback();
      closeModal();
    });

    ui.modalCancel.addEventListener('click', closeModal);

    ui.modalInput.addEventListener('keypress', (event) => {
      if (event.key === 'Enter' && modalInputMode) {
        if (modalCallback) modalCallback();
        closeModal();
      }
    });

    loadSavedData();
    document.addEventListener('click', handleClick);
    document.addEventListener('change', handleChange);
    render();
  </script>
</body>
</html>
